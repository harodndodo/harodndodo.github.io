<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #ffffff;
      width: 90%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #764ba2;
      margin-bottom: 15px;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 24px;
      font-weight: 600;
      color: #333;
    }

    .title {
      font-size: 14px;
      color: #777;
      margin-bottom: 15px;
    }

    .bio {
      font-size: 14px;
      color: #555;
      margin-bottom: 25px;
    }

    .links a {
      display: block;
      text-decoration: none;
      margin: 10px 0;
      padding: 12px;
      border-radius: 8px;
      color: white;
      font-weight: 500;
      transition: 0.3s;
    }

    .github {
      background: #24292e;
    }

    .github:hover {
      background: #000;
    }

    .email {
      background: #007bff;
    }

    .email:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Optional profile picture -->
    <!-- <img src="profile.jpg" alt="Profile Picture"> -->

    <h1>Harod Jay T. Avila</h1>
    <div class="title">Computer Science Student | Web Developer kunuhay</div>

    <div class="bio">
      Hello! I am a Computer Science student who loves building simple and clean web projects.
    </div>

    <div class="links">
      <a class="github" href="https://github.com/harodndodo/harodndodo.github.io" target="_blank">GitHub Profile</a>
      <a class="email" href="mailto:harodjayavila@gmail.com">Email Me</a>
    </div>
  </div>

</body>
</html>
